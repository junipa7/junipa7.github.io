<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee SeungHoon Knowledge Home</title>
    <link rel="stylesheet" href="style.css">
    <script>
        MathJax = {
            tex: {
                inlineMath: [["$", "$"], ["\\(", "\\)"]],
                displayMath: [["$$", "$$"], ["\\[", "\\]"]]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="profile-section">
                <img src="img/profilepicture.jpg" alt="Lee SeungHoon profile" class="profile-img">
                <div class="profile-copy">
                    <p class="user-name">Lee SeungHoon</p>
                    <p class="user-title">Manufacturing Systems · SEMI · MES</p>
                </div>
                <button id="theme-toggle" class="theme-btn" type="button" aria-label="Switch color theme">Dark</button>
            </div>

            <div class="menu-header">
                <span>Library</span>
                <button id="collapse-all" class="mini-btn" type="button">펼치기</button>
            </div>
            <div id="menu-root" class="menu-root"></div>
        </aside>

        <main class="workspace">
            <div class="topbar">
                <div>
                    <div class="eyebrow">Preview</div>
                    <div class="tab-title" id="current-tab">About Me</div>
                </div>
                <div class="topbar-meta">
                    <span>UTF-8</span>
                    <span id="clock">00:00:00</span>
                </div>
            </div>
            <div class="preview-tabs" id="preview-tabs" role="tablist" aria-label="Open preview tabs"></div>
            <div class="content-area" id="editor-content"></div>
        </main>
    </div>

    <script src="menu-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
